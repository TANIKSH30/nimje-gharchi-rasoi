<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ngrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b733d" />
      <stop offset="45%" stop-color="#145a2f" />
      <stop offset="100%" stop-color="#083a1b" />
    </linearGradient>
    <linearGradient id="ngrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Emerald Circular Crest -->
  <circle cx="32" cy="32" r="30" fill="url(#ngrBg)" />
  
  <!-- Warm Gold Inner Accent Ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#ngrGold)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 2" />

  <!-- Crossed Fork & Spoon / Utensils from Nimje Gharchi Rasoi Brand -->
  <g transform="translate(13.5, 13.5) scale(1.54)" filter="url(#softGlow)">
    <!-- Fork Prongs and Shoulder -->
    <path
      d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"
      stroke="url(#ngrGold)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Spoon Bowl and Crossed Stem -->
    <path
      d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"
      stroke="url(#ngrGold)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Fork Handle Bottom -->
    <path
      d="m2.1 21.8 6.4-6.3"
      stroke="url(#ngrGold)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Joint Accent -->
    <path
      d="m19 5-7 7"
      stroke="url(#ngrGold)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>